[pytest]
# Single source of pytest configuration (pyproject.toml holds ruff config only).
testpaths = tests
norecursedirs = docker_data .venv .git qdrant_local_db qdrant_test_db qdrant_test_db_v2 web auric-application .remember
pythonpath = .
# Unknown markers are errors, so a typo cannot silently opt a test out of CI's
# `-m "not live and not models"` filter.
addopts = --strict-markers
markers =
    live: needs running services or credentials (Postgres, Qdrant, Ollama, Gemini keys, a running API). Skipped unless RUN_LIVE_TESTS=1; always deselected in CI.
    models: loads real Hugging Face model weights (bge-m3 ~2.3GB, bge-reranker-v2-m3, cross-encoders). Runs locally; deselected in CI to keep it fast and offline-safe.
