# Uptime check for the public backend.
#
# Pings /health every 6 hours. On a host that sleeps when idle (a free Hugging
# Face Space sleeps after 48h) this also keeps it awake; on an always-on VM it
# is a free alarm that the demo link still works.
#
# Configure a repository VARIABLE (not a secret — the URL is public) named
# BACKEND_URL, e.g. https://redline-dd.duckdns.org, under Settings → Secrets and
# variables → Actions → Variables. SPACE_URL is still honoured for older setups.
# While neither is set the job skips with a notice instead of failing — a red
# run every 6 hours trains you to ignore the one that matters.
#
# GitHub disables scheduled workflows in a repository with no activity for 60
# days. When that happens the check stops silently; any commit resets the clock.

name: Uptime check

on:
  schedule:
    - cron: "0 */6 * * *"
  # Manual trigger, for confirming the URL is right without waiting for the cron.
  workflow_dispatch:

# The default GITHUB_TOKEN permissions are not needed — this job only makes an
# outbound request.
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ping the backend health endpoint
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || vars.SPACE_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::notice::BACKEND_URL repository variable is not set; skipping."
            exit 0
          fi

          # A sleeping host wakes on the first request but can take minutes to
          # load models, so the request must outlast a cold start rather than
          # time out and report failure on a backend that is in fact starting.
          # --retry-all-errors covers the 502/503s served while it boots.
          curl --fail --show-error --silent \
               --max-time 300 \
               --retry 5 --retry-delay 30 --retry-all-errors \
               "${BACKEND_URL%/}/health"

          echo ""
          echo "Backend is up."
